name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p web/dist && touch web/dist/.keep
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - id: has_web
        working-directory: .
        run: if [ -f web/package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has_web.outputs.yes == 'true'
        uses: pnpm/action-setup@v4
        with: { version: 10 }
      - if: steps.has_web.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - if: steps.has_web.outputs.yes == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.has_web.outputs.yes == 'true'
        run: pnpm typecheck
      - if: steps.has_web.outputs.yes == 'true'
        run: pnpm build
