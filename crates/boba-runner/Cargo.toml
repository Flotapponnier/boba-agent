[package]
name = "boba-runner"
description = "Runs Claude Code agents in isolated git worktrees and streams their output for Boba Agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
boba-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v5"] }
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
