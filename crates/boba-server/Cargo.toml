[package]
name = "boba-server"
description = "Boba Agent server: REST + WebSocket API, persistence, auth/RBAC and orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "boba_server"
path = "src/lib.rs"

[[bin]]
name = "boba-agent"
path = "src/main.rs"

[dependencies]
boba-core.workspace = true
boba-runner.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "compression-br", "cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
futures = "0.3"
time = "0.3"
aes-gcm = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
tokio-tungstenite = "0.26"
